name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven settings.xml for Nexus
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, SonarQube Scan & Deploy to Nexus
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn --batch-mode clean verify deploy \
            -DskipTests \
            -Dsonar.projectKey=train-ticket-reservation \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_REPO_URL }}

      - name: Locate WAR file
        run: |
          WAR_FILE=$(ls target/*.war | head -n 1)
          echo "WAR_FILE=$WAR_FILE" >> $GITHUB_ENV

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-reservation-war
          path: ${{ env.WAR_FILE }}

  deploy-dev:
    name: Deploy to DEV (Tomcat)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-reservation-war

      - name: Deploy WAR to Tomcat DEV
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          WAR_FILE=$(ls *.war | head -n 1)
          APP_NAME=$(basename "$WAR_FILE" .war)

          echo "Deploying $WAR_FILE to DEV as context /$APP_NAME"

          curl --fail --show-error \
            -u "$TOMCAT_USER:$TOMCAT_PASS" \
            -T "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/$APP_NAME&update=true"
